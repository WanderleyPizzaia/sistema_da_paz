# Postgres local para desenvolvimento. Em produção o banco é o do EasyPanel.
# Subir:  docker compose up -d db
# Parar:  docker compose down
services:
  db:
    image: postgres:16
    container_name: paz_db
    environment:
      POSTGRES_USER: paz
      POSTGRES_PASSWORD: paz
      POSTGRES_DB: paz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
